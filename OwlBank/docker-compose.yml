version: '3.9'

services:
  postgres-db:
    image: postgres:16
    container_name: owlbank-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: owlbank
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  owlbank-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: owlbank-api

    ports:
      - "8080:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres-db;Port=5432;Database=owlbank;Username=postgres;Password=postgres

    depends_on:
      - postgres-db

volumes:
  postgres-data: